<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e8ecf8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg1)" rx="20"/>
  <!-- Left earbud -->
  <ellipse cx="145" cy="190" rx="38" ry="42" fill="#1a1a2e"/>
  <ellipse cx="145" cy="190" rx="28" ry="32" fill="#16213e"/>
  <circle cx="145" cy="185" r="10" fill="#0f3460"/>
  <circle cx="145" cy="185" r="5" fill="#533483" opacity="0.7"/>
  <path d="M120 165 Q110 140 125 125" stroke="#1a1a2e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Right earbud -->
  <ellipse cx="255" cy="190" rx="38" ry="42" fill="#1a1a2e"/>
  <ellipse cx="255" cy="190" rx="28" ry="32" fill="#16213e"/>
  <circle cx="255" cy="185" r="10" fill="#0f3460"/>
  <circle cx="255" cy="185" r="5" fill="#533483" opacity="0.7"/>
  <path d="M280 165 Q290 140 275 125" stroke="#1a1a2e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Charging case -->
  <rect x="140" y="260" width="120" height="65" rx="20" fill="#1a1a2e"/>
  <rect x="150" y="265" width="100" height="30" rx="12" fill="#16213e"/>
  <line x1="190" y1="300" x2="210" y2="300" stroke="#533483" stroke-width="3" stroke-linecap="round"/>
  <!-- LED indicator -->
  <circle cx="200" cy="338" r="3" fill="#00d4aa"/>
  <text x="200" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Wireless Earbuds</text>
</svg>

