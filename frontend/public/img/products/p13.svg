<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="lotion" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8bbd0"/>
      <stop offset="30%" stop-color="#fce4ec"/>
      <stop offset="70%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg13)" rx="20"/>
  <!-- Bottle body -->
  <rect x="140" y="130" width="120" height="200" rx="14" fill="url(#lotion)" stroke="#f48fb1" stroke-width="2"/>
  <!-- Pump top -->
  <rect x="180" y="80" width="40" height="55" rx="6" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1.5"/>
  <!-- Pump nozzle -->
  <rect x="178" y="70" width="20" height="15" rx="5" fill="#e0e0e0"/>
  <line x1="188" y1="70" x2="170" y2="60" stroke="#bbb" stroke-width="4" stroke-linecap="round"/>
  <circle cx="165" cy="58" r="5" fill="#bbb"/>
  <!-- Label -->
  <rect x="150" y="190" width="100" height="90" rx="8" fill="#fff" opacity="0.95"/>
  <text x="200" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ad1457">NOURISHING</text>
  <text x="200" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c2185b">BODY</text>
  <text x="200" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c2185b">LOTION</text>
  <text x="200" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ad1457">500ml</text>
  <!-- Highlight -->
  <rect x="150" y="140" width="6" height="170" rx="3" fill="#fff" opacity="0.3"/>
  <text x="200" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Body Lotion 500ml</text>
</svg>

