<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffecb3"/>
    </linearGradient>
    <linearGradient id="oil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f9a825"/>
      <stop offset="30%" stop-color="#fdd835"/>
      <stop offset="70%" stop-color="#fdd835"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg10)" rx="20"/>
  <!-- Bottle body -->
  <rect x="130" y="130" width="140" height="210" rx="10" fill="url(#oil)" stroke="#f57f17" stroke-width="2"/>
  <!-- Neck -->
  <rect x="170" y="80" width="60" height="55" rx="6" fill="#fdd835" stroke="#f57f17" stroke-width="2"/>
  <!-- Cap -->
  <rect x="175" y="55" width="50" height="30" rx="8" fill="#e65100" stroke="#bf360c" stroke-width="1"/>
  <!-- Handle -->
  <path d="M270 140 Q310 140 310 180 Q310 220 270 220" fill="none" stroke="#f57f17" stroke-width="8" stroke-linecap="round"/>
  <!-- Label -->
  <rect x="145" y="200" width="110" height="90" rx="6" fill="#fff" opacity="0.95"/>
  <text x="200" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#bf360c">REFINED</text>
  <text x="200" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e65100">COOKING OIL</text>
  <text x="200" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#f57f17">5L</text>
  <!-- Liquid level line -->
  <line x1="140" y1="170" x2="260" y2="170" stroke="#f9a825" stroke-width="1" opacity="0.5"/>
  <text x="200" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Cooking Oil 5L</text>
</svg>

