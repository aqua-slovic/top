<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg15" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#c5cae9"/>
    </linearGradient>
    <linearGradient id="usb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#283593"/>
      <stop offset="50%" stop-color="#3949ab"/>
      <stop offset="100%" stop-color="#283593"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg15)" rx="20"/>
  <!-- USB body -->
  <rect x="110" y="165" width="180" height="70" rx="10" fill="url(#usb)" stroke="#1a237e" stroke-width="2"/>
  <!-- Metal connector -->
  <rect x="285" y="175" width="45" height="50" rx="3" fill="#bdbdbd" stroke="#9e9e9e" stroke-width="1"/>
  <rect x="290" y="182" width="35" height="36" rx="2" fill="#e0e0e0"/>
  <!-- Inner connector details -->
  <rect x="295" y="190" width="25" height="8" rx="1" fill="#fff"/>
  <rect x="295" y="202" width="25" height="8" rx="1" fill="#fff"/>
  <!-- LED indicator -->
  <circle cx="140" cy="200" r="5" fill="#4caf50" opacity="0.8"/>
  <circle cx="140" cy="200" r="3" fill="#69f0ae"/>
  <!-- Label on drive -->
  <text x="195" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">USB 3.0</text>
  <text x="195" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#c5cae9">32GB</text>
  <!-- Keyring hole -->
  <circle cx="105" cy="200" r="10" fill="none" stroke="#1a237e" stroke-width="3"/>
  <text x="200" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">USB Flash Drive 32GB</text>
</svg>

