<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#f8f0e8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg2)" rx="20"/>
  <!-- Charger body -->
  <rect x="145" y="100" width="110" height="140" rx="14" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  <rect x="155" y="110" width="90" height="120" rx="10" fill="#fff"/>
  <!-- USB-C port -->
  <rect x="180" y="235" width="40" height="12" rx="4" fill="#e0e0e0"/>
  <rect x="188" y="238" width="24" height="6" rx="2" fill="#bbb"/>
  <!-- Prongs -->
  <rect x="170" y="60" width="14" height="45" rx="3" fill="#c0c0c0"/>
  <rect x="216" y="60" width="14" height="45" rx="3" fill="#c0c0c0"/>
  <!-- Lightning bolt icon -->
  <path d="M195 145 L185 175 L198 175 L190 205 L215 165 L200 165 L210 145 Z" fill="#ff9900" opacity="0.9"/>
  <!-- Cable -->
  <path d="M200 247 Q200 280 180 310 Q160 340 200 350" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- USB-C end -->
  <rect x="192" y="348" width="16" height="20" rx="3" fill="#666"/>
  <text x="200" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Fast Charger</text>
</svg>

