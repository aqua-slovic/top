<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <pattern id="floral" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="3" fill="#e91e63" opacity="0.2"/>
      <circle cx="0" cy="0" r="2" fill="#f48fb1" opacity="0.3"/>
      <circle cx="30" cy="30" r="2" fill="#f48fb1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg7)" rx="20"/>
  <!-- Dress body -->
  <path d="M170 110 L145 340 Q145 350 200 350 Q255 350 255 340 L230 110" fill="#e91e63"/>
  <rect x="170" y="110" width="60" height="240" fill="url(#floral)"/>
  <path d="M145 340 Q145 350 200 350 Q255 350 255 340" fill="url(#floral)"/>
  <!-- Wrap V-neck -->
  <path d="M170 110 Q200 180 230 110" fill="#c2185b"/>
  <path d="M170 110 L200 160" stroke="#fff" stroke-width="1" opacity="0.5"/>
  <path d="M230 110 L200 160" stroke="#fff" stroke-width="1" opacity="0.5"/>
  <!-- Straps -->
  <line x1="175" y1="110" x2="165" y2="80" stroke="#e91e63" stroke-width="4" stroke-linecap="round"/>
  <line x1="225" y1="110" x2="235" y2="80" stroke="#e91e63" stroke-width="4" stroke-linecap="round"/>
  <!-- Waist tie -->
  <path d="M155 210 Q140 220 130 215" stroke="#c2185b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M155 210 Q140 200 128 208" stroke="#c2185b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="145" y1="210" x2="255" y2="210" stroke="#c2185b" stroke-width="2"/>
  <!-- Flare -->
  <path d="M145 260 Q130 310 120 350" stroke="#c2185b" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M255 260 Q270 310 280 350" stroke="#c2185b" stroke-width="1" fill="none" opacity="0.3"/>
  <text x="200" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Wrap Dress</text>
</svg>

