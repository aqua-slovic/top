      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#ede8e0"/>
    </linearGradient>
    <linearGradient id="pan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
