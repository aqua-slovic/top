  </defs>
  <rect width="400" height="400" fill="url(#bg4)" rx="20"/>
  <!-- Handle -->
  <rect x="280" y="185" width="100" height="22" rx="8" fill="#8B7355"/>
  <rect x="280" y="188" width="100" height="16" rx="6" fill="#a08060"/>
  <circle x="370" cy="196" r="4" fill="#6B5335"/>
  <!-- Pan body -->
