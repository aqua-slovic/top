<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
    <linearGradient id="denim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="50%" stop-color="#1976d2"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg8)" rx="20"/>
  <!-- Waistband -->
  <rect x="130" y="70" width="140" height="30" rx="4" fill="#0d47a1"/>
  <line x1="130" y1="85" x2="270" y2="85" stroke="#0a3d82" stroke-width="1"/>
  <!-- Belt loops -->
  <rect x="155" y="65" width="8" height="20" rx="2" fill="#0d47a1" stroke="#0a3d82" stroke-width="0.5"/>
  <rect x="195" y="65" width="8" height="20" rx="2" fill="#0d47a1" stroke="#0a3d82" stroke-width="0.5"/>
  <rect x="237" y="65" width="8" height="20" rx="2" fill="#0d47a1" stroke="#0a3d82" stroke-width="0.5"/>
  <!-- Button -->
  <circle cx="200" cy="80" r="5" fill="#c0a060" stroke="#a08040" stroke-width="1"/>
  <!-- Left leg -->
  <path d="M130 100 L125 350 L190 350 L200 100" fill="url(#denim)" stroke="#0d47a1" stroke-width="1"/>
  <!-- Right leg -->
  <path d="M200 100 L210 350 L275 350 L270 100" fill="url(#denim)" stroke="#0d47a1" stroke-width="1"/>
  <!-- Fly -->
  <line x1="200" y1="100" x2="200" y2="185" stroke="#0d47a1" stroke-width="2"/>
  <!-- Pockets stitching -->
  <path d="M140 105 L155 130 L195 130 L195 105" fill="none" stroke="#1e88e5" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M260 105 L245 130 L205 130 L205 105" fill="none" stroke="#1e88e5" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Knee fade -->
  <ellipse cx="165" cy="240" rx="25" ry="35" fill="#1e88e5" opacity="0.3"/>
  <ellipse cx="240" cy="240" rx="25" ry="35" fill="#1e88e5" opacity="0.3"/>
  <text x="200" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Slim Fit Jeans</text>
</svg>

