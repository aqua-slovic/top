<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#dcedc8"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="30%" stop-color="#cfd8dc"/>
      <stop offset="70%" stop-color="#eceff1"/>
      <stop offset="100%" stop-color="#b0bec5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg5)" rx="20"/>
  <!-- Bottle body -->
  <rect x="150" y="120" width="100" height="220" rx="15" fill="url(#bottle)"/>
  <!-- Neck -->
  <rect x="175" y="80" width="50" height="45" rx="6" fill="#90a4ae"/>
  <!-- Cap/lid -->
  <rect x="168" y="55" width="64" height="30" rx="10" fill="#37474f"/>
  <rect x="172" y="52" width="56" height="10" rx="5" fill="#455a64"/>
  <!-- Label area -->
  <rect x="160" y="180" width="80" height="100" rx="6" fill="#fff" opacity="0.9"/>
  <text x="200" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#37474f">STAINLESS</text>
  <text x="200" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#37474f">STEEL</text>
  <text x="200" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2196f3">1L</text>
  <!-- Highlight -->
  <rect x="160" y="130" width="8" height="190" rx="4" fill="#fff" opacity="0.3"/>
  <text x="200" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Water Bottle 1L</text>
</svg>

