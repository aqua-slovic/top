<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg16" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
    <linearGradient id="kettle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bdbdbd"/>
      <stop offset="25%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#eeeeee"/>
      <stop offset="75%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#bdbdbd"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg16)" rx="20"/>
  <!-- Kettle body -->
  <path d="M120 150 Q120 130 200 120 Q280 130 280 150 L280 290 Q280 320 200 325 Q120 320 120 290 Z" fill="url(#kettle)" stroke="#9e9e9e" stroke-width="2"/>
  <!-- Water level window -->
  <rect x="255" y="170" width="15" height="100" rx="4" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <rect x="258" y="210" width="9" height="55" rx="2" fill="#64b5f6" opacity="0.5"/>
  <!-- Handle -->
  <path d="M280 160 Q330 160 330 220 Q330 280 280 280" fill="none" stroke="#616161" stroke-width="10" stroke-linecap="round"/>
  <path d="M280 160 Q320 160 320 220 Q320 280 280 280" fill="none" stroke="#757575" stroke-width="6" stroke-linecap="round"/>
  <!-- Spout -->
  <path d="M120 170 Q90 160 85 140 Q83 130 90 125" fill="none" stroke="#9e9e9e" stroke-width="5" stroke-linecap="round"/>
  <!-- Lid -->
  <ellipse cx="200" cy="122" rx="75" ry="15" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="1.5"/>
  <!-- Lid knob -->
  <rect x="188" y="105" width="24" height="15" rx="5" fill="#757575"/>
  <!-- Base -->
  <ellipse cx="200" cy="325" rx="85" ry="12" fill="#424242"/>
  <ellipse cx="200" cy="340" rx="95" ry="10" fill="#333"/>
  <!-- Steam -->
  <path d="M180 100 Q175 80 180 60" stroke="#ccc" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M200 95 Q195 70 200 50" stroke="#ccc" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M220 100 Q215 80 220 60" stroke="#ccc" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <text x="200" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Electric Kettle 1.7L</text>
</svg>

