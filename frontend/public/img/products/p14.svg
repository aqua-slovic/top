<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg14" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#b2ebf2"/>
    </linearGradient>
    <linearGradient id="shampoo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0097a7"/>
      <stop offset="30%" stop-color="#00acc1"/>
      <stop offset="70%" stop-color="#26c6da"/>
      <stop offset="100%" stop-color="#0097a7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg14)" rx="20"/>
  <!-- Bottle body -->
  <path d="M145 150 L140 310 Q140 330 160 330 L240 330 Q260 330 260 310 L255 150 Z" fill="url(#shampoo)" stroke="#00838f" stroke-width="2"/>
  <!-- Neck -->
  <rect x="165" y="100" width="70" height="55" rx="5" fill="#00acc1" stroke="#00838f" stroke-width="2"/>
  <!-- Flip cap -->
  <rect x="168" y="75" width="64" height="30" rx="8" fill="#e0f7fa" stroke="#80deea" stroke-width="1.5"/>
  <line x1="200" y1="80" x2="200" y2="100" stroke="#80deea" stroke-width="1"/>
  <!-- Label -->
  <rect x="155" y="185" width="90" height="85" rx="8" fill="#fff" opacity="0.95"/>
  <text x="200" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#006064">GENTLE DAILY</text>
  <text x="200" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#00838f">SHAMPOO</text>
  <text x="200" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0097a7">400ml</text>
  <!-- Highlight -->
  <rect x="150" y="155" width="5" height="155" rx="2" fill="#fff" opacity="0.3"/>
  <!-- Bubbles decoration -->
  <circle cx="280" cy="140" r="10" fill="#fff" opacity="0.3"/>
  <circle cx="295" cy="120" r="6" fill="#fff" opacity="0.2"/>
  <circle cx="270" cy="115" r="4" fill="#fff" opacity="0.25"/>
  <text x="200" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Shampoo 400ml</text>
</svg>

